name: Deploy V4 to GitHub Pages

on:
  push:
    branches: [main, claude/multi-session-range-cards-0Kmv2]
    paths: [v4/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v4/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: v4

      - name: Build
        run: npm run build
        working-directory: v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: v4/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
